<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A simple, responsive calculator for everyday calculations." />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="calculator" aria-label="Calculator">
        <div class="display" role="group" aria-label="Calculator display">
          <p class="previous-display" id="previous-display" aria-live="polite">&nbsp;</p>
          <output class="current-display" id="current-display" aria-live="polite" aria-atomic="true">0</output>
        </div>

        <div class="keypad" id="keypad">
          <button class="key key--utility" type="button" data-action="clear" aria-label="All clear">AC</button>
          <button class="key key--utility" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
          <button class="key key--utility" type="button" data-action="percent" aria-label="Percent">%</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="/" aria-label="Divide" aria-pressed="false">÷</button>

          <button class="key key--number" type="button" data-action="digit" data-value="7">7</button>
          <button class="key key--number" type="button" data-action="digit" data-value="8">8</button>
          <button class="key key--number" type="button" data-action="digit" data-value="9">9</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="*" aria-label="Multiply" aria-pressed="false">×</button>

          <button class="key key--number" type="button" data-action="digit" data-value="4">4</button>
          <button class="key key--number" type="button" data-action="digit" data-value="5">5</button>
          <button class="key key--number" type="button" data-action="digit" data-value="6">6</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="-" aria-label="Subtract" aria-pressed="false">−</button>

          <button class="key key--number" type="button" data-action="digit" data-value="1">1</button>
          <button class="key key--number" type="button" data-action="digit" data-value="2">2</button>
          <button class="key key--number" type="button" data-action="digit" data-value="3">3</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="+" aria-label="Add" aria-pressed="false">+</button>

          <button class="key key--utility" type="button" data-action="sign" aria-label="Toggle positive or negative">+/−</button>
          <button class="key key--number" type="button" data-action="digit" data-value="0">0</button>
          <button class="key key--number" type="button" data-action="decimal" aria-label="Decimal point">.</button>
          <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>
        </div>

        <p class="hint">Keyboard: digits, + − * /, Enter, Backspace, Esc</p>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
